spring.application.name=pet-shelter-management-system

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:shelter;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Auto-create tables from entity classes
spring.jpa.hibernate.ddl-auto=create-drop

# H2 web console to browse data while running
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# To see what SQL is being executed
spring.jpa.show-sql=true